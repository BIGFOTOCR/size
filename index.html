<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo | Big Foto CR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,700&display=swap');

        :root {
            --magenta: #e81b6d;
            --cyan: #75e8d3;
            --yellow: #ffbc00;
            --dark-bg: #111111;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #111111; 
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0;
        }

        .main-container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--dark-bg); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            padding-bottom: 90px; 
        }

        /* NAVEGADOR ESTILO PÍLDORA EN UNA SOLA FILA DESLIZABLE */
        .nav-tabs {
            display: flex; 
            flex-wrap: nowrap; /* Fuerza a que todo esté en una línea */
            gap: 8px; 
            padding: 15px 12px;
            background: #ffffff;
            justify-content: flex-start; /* Empieza desde la izquierda para permitir scroll */
            position: sticky; top: 0; z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow-x: auto; /* Permite deslizar horizontalmente */
            -webkit-overflow-scrolling: touch; /* Suavidad en iPhone */
            scrollbar-width: none; /* Oculta la barrita de scroll en Firefox */
        }
        
        /* Oculta la barrita de scroll en Chrome, Safari y Edge */
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: #f4f4f4; border: 2px solid transparent; color: #555; padding: 10px 16px;
            border-radius: 30px; font-family: 'Montserrat', sans-serif; font-weight: 800;
            font-size: 0.75rem; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;
            flex: 0 0 auto; /* Evita que los botones se encojan */
            white-space: nowrap; /* Evita que el texto del botón salte a dos líneas */
            text-align: center; letter-spacing: -0.3px;
        }
        
        .nav-btn.active { 
            background: var(--dark-bg); 
            color: #ffffff; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }
        
        /* Bordes de color según la categoría activa */
        .nav-btn.active.tab-llav { border-color: var(--magenta); }
        .nav-btn.active.tab-aluminio { border-color: var(--yellow); }
        .nav-btn.active.tab-acrilico { border-color: var(--cyan); }
        .nav-btn.active.tab-porta { border-color: var(--magenta); }
        .nav-btn.active.tab-stand { border-color: var(--cyan); }

        /* CONTENEDOR DE LA IMAGEN */
        .catalog-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #111;
        }
        .catalog-image {
            width: 100%;
            height: auto;
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* BOTÓN FLOTANTE INFERIOR */
        .floating-cta-container { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 90%; 
            max-width: 400px;
            z-index: 100;
        }
        
        .btn-whatsapp {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: #25D366; color: #fff; padding: 16px 20px;
            border-radius: 40px; font-family: 'Montserrat', sans-serif; font-weight: 900; 
            text-transform: uppercase; font-size: 1rem; width: 100%; 
            border: 2px solid #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(37, 211, 102, 0.5); 
            cursor: pointer; transition: 0.2s transform;
        }
        .btn-whatsapp:active { transform: scale(0.96); }
        
        /* Icono SVG Oficial de WhatsApp */
        .wa-icon { width: 24px; height: 24px; fill: currentColor; }

    </style>
</head>
<body>
    <div class="main-container">
        
        <!-- PESTAÑAS DE NAVEGACIÓN (AHORA DESLIZABLES) -->
        <nav class="nav-tabs" id="menu-tabs">
            <button class="nav-btn tab-llav active" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 10.45.41 PM (1).jpeg', 'Llaveros', this)">Llaveros</button>
            <button class="nav-btn tab-aluminio" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 10.45.41 PM.jpeg', 'Cuadros de Aluminio', this)">Cuadros de Aluminio</button>
            <button class="nav-btn tab-acrilico" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 10.45.40 PM (2).jpeg', 'Cuadros de Acrílico', this)">Cuadros de Acrílico</button>
            <button class="nav-btn tab-porta" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 10.52.52 PM.jpeg', 'Portaretratos', this)">Portaretratos</button>
            <button class="nav-btn tab-stand" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 10.45.40 PM (1).jpeg', 'Standees', this)">Standees</button>
        </nav>

        <!-- AFICHE INICIAL AHORA ES LLAVEROS -->
        <div class="catalog-image-container">
            <img id="main-flyer" class="catalog-image" src="WhatsApp Image 2026-10-13 at 10.45.41 PM (1).jpeg" alt="Catálogo Big Foto CR">
        </div>

    </div>

    <!-- BOTÓN FLOTANTE FIJO -->
    <div class="floating-cta-container">
        <button class="btn-whatsapp" onclick="sendWA()">
            <!-- VECTOR OFICIAL DE WHATSAPP -->
            <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.571-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
            </svg>
            COTIZAR AHORA
        </button>
    </div>

    <script>
        let currentCategory = 'Llaveros';

        function loadFlyer(imgSrc, categoryName, btnEl) {
            // Quitar clase active de todos
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            // Agregar activo al seleccionado
            btnEl.classList.add('active');

            // Centrar el botón seleccionado suavemente en el carrusel
            btnEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

            // Cambiar imagen
            const flyerImg = document.getElementById('main-flyer');
            flyerImg.style.animation = 'none';
            flyerImg.offsetHeight; 
            flyerImg.style.animation = 'fadeIn 0.4s ease-in-out';
            
            flyerImg.src = imgSrc;
            currentCategory = categoryName;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function sendWA() {
            const msg = `¡Hola Big Foto CR! Estuve viendo su catálogo y me interesa la sección de *${currentCategory}*. ¿Me pueden ayudar con una cotización?`;
            window.open('https://wa.me/50688466111?text=' + encodeURIComponent(msg), '_blank');
        }
    </script>
</body>
</html>
