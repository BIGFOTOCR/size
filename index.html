<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo | Big Foto CR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,700&display=swap');

        :root {
            --magenta: #e81b6d;
            --cyan: #75e8d3;
            --yellow: #ffbc00;
            --dark-bg: #111111;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #111111; 
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0;
        }

        .main-container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--dark-bg); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            /* Espacio extra abajo para que la imagen no quede tapada por el botón flotante */
            padding-bottom: 90px; 
        }

        /* NAVEGADOR ESTÁTICO EN LA PARTE SUPERIOR */
        .nav-tabs {
            display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 10px;
            background: #fff;
            justify-content: center; position: sticky; top: 0; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-top: 6px solid var(--magenta);
        }
        .nav-btn {
            background: #f0f0f0; border: none; color: #555; padding: 12px 10px;
            border-radius: 8px; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 0.75rem; text-transform: uppercase; cursor: pointer; transition: 0.2s;
            flex-grow: 1; text-align: center; letter-spacing: -0.5px;
        }
        
        .nav-btn.active { background: var(--dark-bg); color: var(--yellow); }
        .nav-btn.active.tab-aluminio { border-bottom: 4px solid var(--magenta); }
        .nav-btn.active.tab-acrilico { border-bottom: 4px solid var(--cyan); }
        .nav-btn.active.tab-porta { border-bottom: 4px solid var(--magenta); }
        .nav-btn.active.tab-stand { border-bottom: 4px solid var(--cyan); }
        .nav-btn.active.tab-llav { border-bottom: 4px solid var(--magenta); }

        /* CONTENEDOR DE LA IMAGEN */
        .catalog-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #111;
        }
        .catalog-image {
            width: 100%;
            height: auto;
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* BOTÓN FLOTANTE INFERIOR */
        .floating-cta-container { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 90%; 
            max-width: 400px;
            z-index: 100;
        }
        
        .btn-whatsapp {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: #25D366; color: #fff; padding: 16px 20px;
            border-radius: 40px; font-family: 'Montserrat', sans-serif; font-weight: 900; 
            text-transform: uppercase; font-size: 1rem; width: 100%; 
            border: 2px solid #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(37, 211, 102, 0.5); 
            cursor: pointer; transition: 0.2s transform;
        }
        .btn-whatsapp:active { transform: scale(0.96); }
        
        /* Icono SVG de WhatsApp */
        .wa-icon { width: 24px; height: 24px; fill: currentColor; }

    </style>
</head>
<body>
    <div class="main-container">
        
        <!-- PESTAÑAS DE NAVEGACIÓN REORDENADAS -->
        <nav class="nav-tabs">
            <button class="nav-btn tab-llav active" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 9.10.19 PM.jpeg', 'Llaveros', this)">Llaveros</button>
            <button class="nav-btn tab-aluminio" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 9.10.03 PM (3).jpeg', 'Cuadros de Aluminio', this)">Cuadros de Aluminio</button>
            <button class="nav-btn tab-acrilico" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 9.10.03 PM (2).jpeg', 'Cuadros de Acrílicos', this)"> Cuadros de Acrílicos</button>
            <button class="nav-btn tab-porta" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 9.10.03 PM (1).jpeg', 'Portaretratos y Mesa', this)">Portaretratos</button>
            <button class="nav-btn tab-stand" onclick="loadFlyer('WhatsApp Image 2026-10-13 at 9.10.03 PM.jpeg', 'Standees Personalizados', this)">Standees</button>
        </nav>

        <!-- AFICHE INICIAL AHORA ES LLAVEROS -->
        <div class="catalog-image-container">
            <img id="main-flyer" class="catalog-image" src="WhatsApp Image 2026-10-13 at 9.10.19 PM.jpeg" alt="Catálogo Big Foto CR">
        </div>

    </div>

    <!-- BOTÓN FLOTANTE FIJO -->
    <div class="floating-cta-container">
        <button class="btn-whatsapp" onclick="sendWA()">
            <svg class="wa-icon" viewBox="0 0 24 24">
                <path d="M12.031 0C5.394 0 0 5.394 0 12.031c0 2.12.553 4.148 1.603 5.952L.114 23.4l5.586-1.464C7.458 22.882 9.7 23.469 12.031 23.469c6.637 0 12.031-5.394 12.031-12.031S18.668 0 12.031 0zm.004 21.493c-1.785 0-3.53-.48-5.06-1.387l-.36-.214-3.766.988 1.006-3.67-.236-.375c-1.002-1.583-1.53-3.41-1.53-5.298 0-5.545 4.512-10.057 10.06-10.057 5.546 0 10.057 4.512 10.057 10.057 0 5.546-4.511 10.056-10.057 10.056zm5.518-7.535c-.303-.152-1.792-.885-2.07-9.987-.278-.101-.481-.152-.683.152-.202.303-.783.987-.96 1.189-.177.202-.354.227-.657.076-.303-.152-1.28-.472-2.438-1.505-.902-.806-1.51-1.802-1.687-2.106-.177-.304-.019-.467.133-.62.136-.135.303-.354.455-.53.151-.177.202-.304.303-.506.1-.202.05-.38-.026-.53-.075-.152-.682-1.645-.934-2.252-.246-.593-.496-.512-.683-.522-.177-.008-.38-.008-.582-.008-.202 0-.53.076-.808.38-.278.303-1.06 1.037-1.06 2.53 0 1.493 1.086 2.936 1.238 3.138.152.202 2.14 3.264 5.184 4.577.724.312 1.29.498 1.732.637.728.232 1.39.199 1.913.12.585-.088 1.792-.733 2.045-1.442.253-.708.253-1.315.177-1.442-.076-.126-.278-.202-.582-.354z"/>
            </svg>
            COTIZAR AHORA
        </button>
    </div>

    <script>
        // La categoría inicial ahora es Llaveros
        let currentCategory = 'Llaveros';

        function loadFlyer(imgSrc, categoryName, btnEl) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnEl.classList.add('active');

            const flyerImg = document.getElementById('main-flyer');
            
            flyerImg.style.animation = 'none';
            flyerImg.offsetHeight; 
            flyerImg.style.animation = 'fadeIn 0.4s ease-in-out';
            
            flyerImg.src = imgSrc;
            currentCategory = categoryName;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function sendWA() {
            const msg = `¡Hola Big Foto CR! Estuve viendo su catálogo y me interesa la sección de *${currentCategory}*. ¿Me pueden ayudar con una cotización?`;
            window.open('https://wa.me/50688466111?text=' + encodeURIComponent(msg), '_blank');
        }
    </script>
</body>
</html>
